
services:
  vad-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile-vad
    image: speech-vad:latest
    container_name: vad-consumer
    restart: unless-stopped

    command: ["serve", "run", "task.vad_consumer:app"]

    env_file:
      - ../.env

    working_dir: /app
    shm_size: "32gb"
    network_mode: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  asr-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile-asr
    image: speech-asr:latest
    container_name: asr-consumer
    restart: unless-stopped

    network_mode: host
    shm_size: "64gb"
    working_dir: /app

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    env_file:
      - ../.env

    command: ["serve", "run", "task.asr:app"]
  
  align-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile-align
    image: speech-align:latest
    container_name: align-consumer
    restart: unless-stopped

    network_mode: host
    shm_size: "48gb"
    working_dir: /app

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    env_file:
      - ../.env

    command: ["serve", "run", "task.align_consumer:app"]

  vad-failed-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile-failed
    image: speech-vad-failed:latest
    container_name: vad-failed-consumer
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    env_file:
      - ../.env
    command: ["serve", "run", "task.vad_failed_consumer:app"]

  asr-failed-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile-failed
    image: speech-asr-failed:latest
    container_name: asr-failed-consumer
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    env_file:
      - ../.env
    command: ["serve", "run", "task.asr_failed_consumer:app"]